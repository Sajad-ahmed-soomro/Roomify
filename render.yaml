# Render Blueprint: New → Blueprint → pick this repo. Secrets marked sync:false
# are asked for in the dashboard.
services:
  - type: web
    name: roomify-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances can't use preDeployCommand, so migrate on start (it's a no-op when up to date).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: IMAGE_ENGINE
        value: remote
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_DESIGNS_PER_USER
        value: "2"
      # Images live in the database. To use a Google Cloud Storage bucket instead, set
      # IMAGE_STORAGE=s3, S3_ENDPOINT_URL=https://storage.googleapis.com, S3_BUCKET,
      # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY in the dashboard.
      - key: IMAGE_STORAGE
        value: db
      - { key: INTERNAL_API_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: RENDER_URL, sync: false }
      - { key: RENDER_KEY, sync: false }
      - { key: UNLIMITED_EMAILS, sync: false }
